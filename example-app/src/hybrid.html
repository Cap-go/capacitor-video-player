<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Hybrid slot video experiment</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
      }
      #feed-scroll {
        height: 100vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .feed-block {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      }
      .slot-shell {
        position: relative;
        width: min(100%, 640px);
        margin: 12px auto;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }
      #hybrid-video-slot {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .slot-overlay-title {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 30;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.75);
        font-size: 0.85rem;
        font-weight: 600;
      }
      .slot-overlay-play {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        width: 72px;
        height: 72px;
        border-radius: 999px;
        border: none;
        background: rgba(37, 99, 235, 0.92);
        color: #fff;
        font-size: 1.5rem;
        cursor: pointer;
      }
      .slot-overlay-tap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 35;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(248, 250, 252, 0.4);
        background: rgba(2, 6, 23, 0.55);
        color: #f8fafc;
        font-size: 0.8rem;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: #1e293b;
        border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
      }
      button.secondary {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.5);
      }
      pre#log {
        white-space: pre-wrap;
        font-size: 0.75rem;
        background: #020617;
        color: #cbd5e1;
        padding: 10px;
        border-radius: 8px;
        max-height: 180px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="startHybrid">Start hybrid slot</button>
      <button id="togglePlay" class="secondary" disabled>Toggle play</button>
      <button id="destroyHybrid" class="secondary" disabled>Destroy</button>
    </div>
    <div id="feed-scroll">
      <div class="feed-block">
        <h1>Hybrid-ui + native video</h1>
        <p>Scroll this feed. The AVPlayer layer follows the slot. Web overlays should steal touches.</p>
      </div>
      <div class="feed-block"><p>Paragraph filler before the video slot.</p></div>
      <div class="feed-block">
        <div class="slot-shell" id="slot-shell">
          <div id="hybrid-video-slot"></div>
          <div id="overlay-title" class="slot-overlay-title">Big Buck Bunny</div>
          <button id="overlay-play" class="slot-overlay-play" type="button">▶</button>
          <button id="overlay-tap" class="slot-overlay-tap" type="button">Web tap target</button>
        </div>
      </div>
      <div class="feed-block"><p>More feed content after the slot.</p></div>
      <div class="feed-block">
        <pre id="log">Waiting for hybrid session...</pre>
      </div>
      <div class="feed-block" style="height: 480px"><p>End spacer for scroll.</p></div>
    </div>
    <script type="module" src="./js/hybrid-feed.js"></script>
  </body>
</html>
