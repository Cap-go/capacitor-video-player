<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fullscreen player mock</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Roboto, 'Segoe UI', sans-serif;
        background: #000;
        color: #fff;
      }
      .frame {
        width: 1280px;
        height: 720px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      }
      .video-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .gradient {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 45%;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      }
      .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        background: linear-gradient(rgba(0, 0, 0, 0.65), transparent);
      }
      .titles .main {
        font-size: 20px;
        font-weight: 500;
      }
      .titles .sub {
        font-size: 13px;
        opacity: 0.85;
        margin-top: 4px;
      }
      .top-actions {
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        width: 48px;
        height: 48px;
        border: none;
        background: transparent;
        color: #fff;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .icon-btn.chapters svg {
        width: 24px;
        height: 24px;
        fill: #fff;
      }
      .icon-btn.hidden {
        visibility: hidden;
      }
      .controls {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 20px;
      }
      .progress {
        height: 3px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 2px;
        margin-bottom: 16px;
      }
      .progress > span {
        display: block;
        width: 32%;
        height: 100%;
        background: #fff;
        border-radius: 2px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .time {
        font-size: 13px;
        opacity: 0.9;
      }
      .transport {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 28px;
      }
      .dialog-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .dialog-backdrop.show {
        display: flex;
      }
      .dialog {
        width: 360px;
        max-height: 70%;
        background: #303030;
        border-radius: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .dialog h2 {
        margin: 0;
        padding: 20px 24px 12px;
        font-size: 20px;
        font-weight: 500;
      }
      .dialog ul {
        list-style: none;
        margin: 0;
        padding: 0 0 8px;
      }
      .dialog li {
        padding: 14px 24px;
        font-size: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dialog li:first-child {
        border-top: none;
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="video-placeholder">Sample video</div>
      <div class="gradient"></div>
      <div class="top-bar">
        <div class="titles">
          <div class="main">Capacitor Video Player</div>
          <div class="sub">Fullscreen demo</div>
        </div>
        <div class="top-actions">
          <button class="icon-btn chapters" id="chaptersBtn" type="button" aria-label="Chapters">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6C3.17 4.5 2.5 5.17 2.5 6S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-6v2h14V5H7z"
              />
            </svg>
          </button>
          <button class="icon-btn" type="button">⛶</button>
          <button class="icon-btn" type="button">✕</button>
        </div>
      </div>
      <div class="controls">
        <div class="progress"><span></span></div>
        <div class="row">
          <div class="time">4:12 / 24:00</div>
          <div class="transport">
            <span>⏮</span>
            <span>▶</span>
            <span>⏭</span>
          </div>
          <div class="time" style="opacity: 0">.</div>
        </div>
      </div>
      <div class="dialog-backdrop" id="dialog">
        <div class="dialog">
          <h2>Chapters</h2>
          <ul>
            <li>Introduction (0:00)</li>
            <li>Setup (2:30)</li>
            <li>Playback controls (8:15)</li>
            <li>Advanced options (15:40)</li>
          </ul>
        </div>
      </div>
    </div>
    <script>
      const mode = new URLSearchParams(location.search).get('mode') || 'after';
      const dialog = document.getElementById('dialog');
      const chaptersBtn = document.getElementById('chaptersBtn');
      if (mode === 'before') {
        chaptersBtn.classList.add('hidden');
        dialog.classList.remove('show');
      } else {
        dialog.classList.add('show');
      }
    </script>
  </body>
</html>
